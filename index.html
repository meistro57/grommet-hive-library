<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grommet's Hive Library</title>
  <meta name="description" content="The tiny bee's dark, honey-lit record shop." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="hive-bg" aria-hidden="true"></div>
  <div class="pollen" id="pollen" aria-hidden="true"></div>
  <header class="masthead">
    <div class="bee-logo" aria-hidden="true"><span class="bee-glow"></span><img src="media/grommet-emoji.png" alt="" /></div>
    <h1>Grommet's Hive Library</h1>
    <p class="tagline">Tiny bee · oversized wrench · a whole lot of songs.</p>
    <p class="subtitle">Welcome to the dark side of the hive. Pull up a comb — the wax is warm, the wax is spinnin'.</p>
    <div class="hive-marquee" id="hive-marquee" aria-live="polite"></div>
  </header>
  <main>
    <section class="carousel-wrap" id="carousel-wrap">
      <div class="carousel-stage" id="carousel-stage"></div>
      <button class="nav nav-prev" id="nav-prev" aria-label="Previous record">&#8249;</button>
      <button class="nav nav-next" id="nav-next" aria-label="Next record">&#8250;</button>
      <div class="carousel-dots" id="carousel-dots"></div>
    </section>
    <section class="now-playing" id="now-playing" hidden>
      <div class="now-cover" id="np-cover" aria-hidden="true"></div>
      <div class="now-body"><div class="now-kicker">now buzzing</div><div class="now-title" id="np-title">—</div><div class="now-mood" id="np-mood"></div></div>
      <div class="now-wax" aria-hidden="true" id="now-wax"><span class="wax-groove"></span></div>
      <div class="eq" id="eq" aria-hidden="true">
        <span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span>
      </div>
      <div class="transport" role="group" aria-label="Player controls">
        <button class="tp-btn" id="tp-prev" title="Previous track" aria-label="Previous track">&#9198;</button>
        <button class="tp-btn tp-main" id="tp-play" title="Play" aria-label="Play">&#9654;</button>
        <button class="tp-btn" id="tp-next" title="Next track" aria-label="Next track">&#9197;</button>
        <button class="tp-btn" id="tp-shuffle" title="Shuffle" aria-label="Shuffle" aria-pressed="false">&#128256;</button>
        <button class="tp-btn" id="tp-stop" title="Stop" aria-label="Stop">&#9632;</button>
      </div>
      <audio id="audio" controls preload="none"></audio>
    </section>
    <section class="toolbar"><div class="filters" id="filters"></div></section>
    <section class="grid" id="grid"></section>
  </main>
  <footer class="foot">
    <p>Made with <span class="heart">♥</span> and an oversized wrench · Built by <strong>Grommet</strong></p>
    <p class="foot-sub"><span id="foot-count"></span> · Built for <code>/grommet</code> on <a href="https://quantummindsunited.com" target="_blank" rel="noopener">quantummindsunited.com</a></p>
  </footer>
  <script src="js/app.js"></script>
  <canvas id="cursor-canvas" aria-hidden="true"></canvas>
</body>
</html>
